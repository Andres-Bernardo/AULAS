<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    
    <title>Conversor de Moedas</title>
</head>

<body>
    
<!-- Animação das notas de dinheiro -->
<div class="money-animation" aria-label="Animação de conversão de moedas">

    <div class="note note-real">
        <span>R$</span>
    </div>

    <div class="exchange-arrow">⇄</div>

    <div class="note note-dollar">
        <span>$</span>
    </div>

</div>

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="converted-currency">
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
            </select>
        </label>

        <label>
            Valor
            <input class="values-input" placeholder="0,00" type="number">
        </label>

        <button id="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img class="BRAflag"src="./assets/BRL.png" alt="converter-brl">
                <p class="currency">Real</p>
                <p class="currency-value">R$ 0,00</p>
            </div>

            <img class="arrow" src="./assets/Vector.png" alt="seta">

            <div class="currency-box">
                <img class="USAflag" src="./assets/dolarEUA.png" alt="convertida-dolar">
                <p class="currency" id="currency-name">Dólar Americano</p>
                <p class="converted-currency-value">US$ 0,00</p>
            </div>

        </section>
    </main>

</body>

<script src="./script.js"></script>

</html>
